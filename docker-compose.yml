# Container logs: each service keeps at most 5 × 20 MB in Docker; the server archives them
# daily and deletes archives older than 30 days.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: activehikes
      POSTGRES_USER: activehikes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activehikes"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    logging: *logging
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://activehikes:${POSTGRES_PASSWORD}@postgres:5432/activehikes
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      ENABLE_BANKING_APPLICATION_ID: ${ENABLE_BANKING_APPLICATION_ID:-}
      ENABLE_BANKING_PRIVATE_KEY: ${ENABLE_BANKING_PRIVATE_KEY:-}
      REVOLUT_SYNC_INTERVAL_MS: ${REVOLUT_SYNC_INTERVAL_MS:-}
      # Push hikes to the management app (empty = off); the token is its INTEGRATION_TOKEN.
      MANAGEMENT_SYNC_URL: ${MANAGEMENT_SYNC_URL:-}
      MANAGEMENT_SYNC_TOKEN: ${MANAGEMENT_SYNC_TOKEN:-}
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # node:20-alpine has busybox wget but no curl; use Node's own fetch so this doesn't depend on either.
    # start_period covers `prisma migrate deploy` running before the server starts.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - default
      - traefik-shared
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-shared"
      - "traefik.http.routers.activehikes.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.activehikes.entrypoints=websecure"
      - "traefik.http.routers.activehikes.tls.certresolver=le"
      - "traefik.http.services.activehikes.loadbalancer.server.port=3000"

volumes:
  postgres_data:
  uploads_data:

networks:
  traefik-shared:
    external: true
